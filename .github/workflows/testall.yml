name: Test All

on:
    push:
        branches:
            - "java-dev"

jobs:
    testall:
        runs-on: ubuntu-latest
        name: Test all
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-java@v4
              with:
                distribution: oracle
                java-version: 21
            - run: make run-build-jar
